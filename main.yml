name: Render 2-Minute Prediabetes Explainer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chrome dependencies for Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2

      - name: Render 2-Minute 1080p MP4
        run: npm run build

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prediabetes-explainer-2min
          path: out/prediabetes-explainer-2min.mp4
